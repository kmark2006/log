<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#131518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Physique Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Physique Log</title>
<style>
:root{
  --bg:#131518; --bg-2:#181b1f; --panel:#1c2025; --panel-2:#22262c; --line:#2b3037; --line-2:#363c45;
  --chalk:#ece7dd; --dim:#8d939c; --dimmer:#7c8592;
  --brass:#c9973f; --brass-2:#e0b565; --brass-dk:#a67d32;
  --amber:#f0a938; --cyan:#38bdf8;
  --go:#63a882; --hot:#c9603f; --ice:#6f96b8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::placeholder{color:#8a929e;opacity:1}
::-webkit-input-placeholder{color:#8a929e;opacity:1}
:-ms-input-placeholder{color:#8a929e;opacity:1}
textarea::placeholder{color:#98a0ac;opacity:1}
.srch::placeholder{color:#98a0ac;opacity:1}
html{background:var(--bg)}
body{margin:0;padding:0 0 92px;background:var(--bg);color:var(--chalk);font-family:var(--sans);
  max-width:680px;margin:0 auto;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}

/* ── masthead ── */
header{position:sticky;top:0;z-index:30;background:rgba(19,21,24,.94);backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.mast{display:flex;align-items:baseline;justify-content:space-between;padding:13px 18px 9px}
.mast .t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.005em;transition:opacity .2s}
.mast .t.hide{opacity:0;pointer-events:none}
.mast .t em{font-style:italic;color:var(--brass);font-weight:400}
.mast .d{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.06em;text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,var(--brass-dk),transparent 62%);margin:0 18px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 10px}
nav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;background:none;border:0;border-bottom:2.5px solid transparent;color:#a7aeb8;
  font:600 13.5px/1 var(--sans);letter-spacing:.015em;padding:13px 12px 11px;cursor:pointer;white-space:nowrap;
  transition:color .15s}
.nb:active{color:#fff}
.nb.on{color:#fff;border-bottom-color:var(--amber)}

.wrap{padding:16px 14px 0}
h2.sec{font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dimmer);font-weight:600;margin:26px 4px 9px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:6px}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}

/* ── cards ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;
  transition:border-color .2s}
.card.flag{border-color:var(--brass-dk);background:linear-gradient(180deg,rgba(201,151,63,.05),var(--panel))}
.chead{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer}
.cn{flex:1;min-width:0}
.cn b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em}
.cn i{display:block;font-style:normal;font-size:9.5px;color:var(--dimmer);letter-spacing:.11em;text-transform:uppercase;margin-top:4px}
.cl{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right;white-space:nowrap;line-height:1.5}
.cl b{color:var(--chalk);font-weight:600;font-size:13px}
.cl span{display:block;font-size:9px;color:var(--dimmer);letter-spacing:.09em;text-transform:uppercase}
.chev{color:var(--dimmer);font-size:17px;transition:transform .2s}
.card.open .chev{transform:rotate(90deg);color:var(--brass)}
.cbody{display:none;border-top:1px solid var(--line);padding:2px 11px 12px}
.card.open .cbody{display:block}

.srow{display:flex;align-items:flex-start;gap:7px;padding:10px 3px;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.sn{width:19px;padding-top:17px;font-family:var(--mono);font-size:10px;color:var(--dimmer)}
.fg{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.gh{font-family:var(--mono);font-size:9.5px;color:var(--brass-dk);height:11px;letter-spacing:.03em}
input.n{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;color:var(--chalk);
  font-family:var(--mono);font-size:17px;font-weight:600;text-align:center;padding:10px 2px;-moz-appearance:textfield}
input.n::-webkit-inner-spin-button,input.n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.n:focus{outline:none;border-color:var(--brass);background:#282d34}
input.n[type=time]{font-size:18px}
.pk{display:flex;gap:3px}
.pb{flex:1;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;color:var(--dim);
  font-family:var(--mono);font-size:13px;font-weight:600;padding:10px 0;cursor:pointer;transition:all .12s}
.pb.on{background:var(--brass);border-color:var(--brass);color:#131518}
.pb.on[data-r="0"]{background:var(--hot);border-color:var(--hot);color:#fff}

.cue{margin:4px 3px 0;padding:9px 11px;border-radius:9px;background:rgba(201,151,63,.09);
  border:1px solid var(--brass-dk);font-size:11.5px;color:var(--brass-2);line-height:1.5}
.cue.go{background:rgba(99,168,130,.09);border-color:#3f6b52;color:var(--go)}

/* ── metric tiles ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 14px;position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--brass-dk)}
.tile.b:before{background:var(--ice)} .tile.g:before{background:var(--go)} .tile.r:before{background:var(--hot)}
.tile .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);margin-bottom:9px}
.tile .v{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1;letter-spacing:-.01em}
.tile .v u{text-decoration:none;font-size:12px;color:var(--dim);margin-left:2px;font-family:var(--sans);font-weight:400}
.tile .s{font-size:10px;color:var(--dim);margin-top:7px;line-height:1.45}
.tile.wide{grid-column:1/-1}

.dl{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);gap:12px}
.dl:last-child{border-bottom:0}
.dl .a{font-size:13px;color:var(--chalk)}
.dl .a u{text-decoration:none;display:block;font-size:9.5px;color:var(--dimmer);margin-top:3px;letter-spacing:.04em}
.dl .b{font-family:var(--mono);font-size:13px;color:var(--chalk);text-align:right;white-space:nowrap}
.dl .b u{text-decoration:none;display:block;font-size:9px;color:var(--dimmer);margin-top:3px}
.hi{color:var(--brass)!important} .lo{color:var(--ice)!important} .ok{color:var(--go)!important} .bad{color:var(--hot)!important}
.fig.hi{color:var(--amber)!important} .fig.ok{color:#7ee0a6!important} .fig.bad{color:#ff8f6b!important}

/* ── timeline ── */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:14px;width:1px;background:var(--line-2)}
.ev{position:relative;padding:0 0 20px}
.ev:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--line-2)}
.ev.now:before{background:var(--brass);border-color:var(--brass);box-shadow:0 0 0 4px rgba(201,151,63,.16)}
.ev .vn{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.07em}
.ev .vd{font-size:9px;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.ev .vt{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:7px}
.ev .vt b{color:var(--chalk);font-weight:600}


/* ── home ── */
.hero{padding:26px 6px 20px}
.hero h1{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.015em;margin:0}
.hero h1 em{display:block;font-style:italic;color:var(--brass);font-weight:400}
.hero .hr2{height:1px;background:linear-gradient(90deg,var(--brass),var(--line) 55%,transparent);margin:15px 0 11px;width:78%}
.hero .dd{font-family:var(--mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dimmer)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:12px}
.big{position:relative;aspect-ratio:1/1;min-width:0;background:rgba(240,169,56,.24);
  border:4px solid var(--amber);border-radius:16px;padding:16px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;text-align:center;color:inherit;font:inherit;
  transition:transform .09s cubic-bezier(.3,.7,.4,1), box-shadow .09s cubic-bezier(.3,.7,.4,1), filter .09s;
  box-shadow:
    0 10px 0 -1px #8a5f14,
    0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(0,0,0,.8),
    0 0 34px -10px rgba(240,169,56,.55),
    inset 0 1.5px 0 rgba(255,255,255,.22),
    inset 0 0 40px -18px rgba(240,169,56,.9)}
.big.n{background:rgba(56,189,248,.24);border-color:var(--cyan);
  box-shadow:
    0 10px 0 -1px #14638f,
    0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(0,0,0,.8),
    0 0 34px -10px rgba(56,189,248,.6),
    inset 0 1.5px 0 rgba(255,255,255,.22),
    inset 0 0 40px -18px rgba(56,189,248,.9)}
.big:active{transform:translateY(10px) scale(.985);filter:brightness(1.25) saturate(1.15);
  box-shadow:0 0 0 -1px #8a5f14,0 2px 5px -4px rgba(0,0,0,.9),
    0 0 18px -10px rgba(240,169,56,.45),inset 0 3px 10px -4px rgba(0,0,0,.55),
    inset 0 0 40px -14px rgba(240,169,56,1)}
.big.n:active{box-shadow:0 0 0 -1px #14638f,0 2px 5px -4px rgba(0,0,0,.9),
    0 0 18px -10px rgba(56,189,248,.45),inset 0 3px 10px -4px rgba(0,0,0,.55),
    inset 0 0 40px -14px rgba(56,189,248,1)}
.big svg{width:33px;height:33px;stroke:var(--amber);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.big.n svg{stroke:var(--cyan)}
.big .fig{font-family:var(--serif);font-size:58px;font-weight:600;line-height:.92;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.big .fig u{text-decoration:none;font-family:var(--sans);font-size:19px;color:rgba(255,255,255,.7);font-weight:400}
.big .lbl{font-size:20px;font-weight:800;color:#fff;margin-top:10px;letter-spacing:-.02em;line-height:1.08;
  text-shadow:0 2px 14px rgba(0,0,0,.45);max-width:100%;overflow-wrap:break-word}
.big .cap{max-width:100%;font-size:11px;color:rgba(255,255,255,.68);line-height:1.4;margin-top:7px}
.big .cap b{color:#fff;font-weight:700}

.wide{position:relative;min-width:0;background:rgba(99,168,130,.22);border:4px solid var(--go);
  border-radius:16px;padding:16px 16px;margin-top:12px;display:flex;align-items:center;gap:15px;
  cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;
  transition:transform .09s cubic-bezier(.3,.7,.4,1),box-shadow .09s cubic-bezier(.3,.7,.4,1),filter .09s;
  box-shadow:0 10px 0 -1px #2e6247,0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(0,0,0,.8),inset 0 1.5px 0 rgba(255,255,255,.22),
    inset 0 0 46px -18px rgba(99,168,130,.9)}
.wide:active{transform:translateY(10px) scale(.99);filter:brightness(1.25) saturate(1.15);
  box-shadow:0 0 0 -1px #2e6247,0 2px 5px -4px rgba(0,0,0,.9),
    inset 0 3px 10px -4px rgba(0,0,0,.55),inset 0 0 46px -14px rgba(99,168,130,1)}
.wide svg{width:33px;height:33px;stroke:var(--go);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wide .tx{flex:1;min-width:0}
.wide .tx b{display:block;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em}
.wide .tx i{display:block;font-style:normal;font-size:11px;color:rgba(255,255,255,.68);margin-top:4px}
.wide .num{text-align:right;flex:0 0 auto}
.wide .num .k{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;color:#fff}
.wide .num .u{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:5px}

/* food screen */
.say{background:var(--panel);border:2.5px solid var(--line-2);border-radius:14px;padding:13px;margin-bottom:12px}
.say textarea{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;
  color:var(--chalk);font:400 15px/1.5 var(--sans);padding:12px;resize:none;min-height:76px}
.say textarea:focus{outline:none;border-color:var(--go)}
.say .hintl{font-size:10.5px;color:var(--dimmer);margin:9px 2px 0;line-height:1.5}
.say .row{display:flex;gap:8px;margin-top:10px}
.say .go2{flex:1;background:linear-gradient(180deg,#7dbd95,var(--go));border:0;border-radius:10px;color:#0d1712;
  font:700 14px var(--sans);padding:13px 0;cursor:pointer}
.say .go2.n{background:linear-gradient(180deg,#7cc9f5,var(--cyan));color:#06222f}
.say .clr{flex:0 0 auto;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:10px;
  color:var(--dim);font:600 13px var(--sans);padding:13px 15px;cursor:pointer}
.conf{border:2px solid var(--go);border-radius:12px;padding:12px;margin-top:11px;background:rgba(99,168,130,.09)}
.conf.n{border-color:var(--cyan);background:rgba(56,189,248,.09)}
.conf h4{margin:0 0 9px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--go);font-weight:700}
.conf.n h4{color:var(--cyan)}
.conf .ci{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.conf .ci:last-of-type{border-bottom:0}
.conf .ci .nm{flex:1;font-size:13.5px}
.conf .ci .nm u{text-decoration:none;display:block;font-size:10px;color:var(--dimmer);margin-top:2px}
.conf .ci input{width:52px;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:8px;
  color:var(--chalk);font-family:var(--mono);font-size:14px;text-align:center;padding:7px 2px}
.conf .ci .drop{background:none;border:0;color:var(--hot);font-size:17px;padding:4px 6px;cursor:pointer}
.conf .miss{font-size:11.5px;color:var(--hot);padding:7px 2px}
.wide.w2{background:rgba(150,130,220,.20);border-color:#9b87dc;
  box-shadow:0 10px 0 -1px #4d3f80,0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(0,0,0,.8),inset 0 1.5px 0 rgba(255,255,255,.22),
    inset 0 0 46px -18px rgba(155,135,220,.9)}
.wide.w2:active{box-shadow:0 0 0 -1px #4d3f80,0 2px 5px -4px rgba(0,0,0,.9),
    inset 0 3px 10px -4px rgba(0,0,0,.55),inset 0 0 46px -14px rgba(155,135,220,1)}
.wide.w2 svg{stroke:#b7a6ea}
.exw{border-bottom:1px solid var(--line)}
.exw .dl{border-bottom:0}
.exc{padding:0 0 10px}
.chart{position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 14%,var(--panel)),var(--panel) 62%);
  border:2.5px solid color-mix(in srgb,var(--ac) 58%,transparent);border-radius:16px;
  padding:14px 12px 8px;margin-bottom:12px;overflow:hidden;
  box-shadow:0 8px 0 -1px rgba(0,0,0,.5),0 14px 22px -10px rgba(0,0,0,.75),
    inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 0 50px -20px var(--ac)}
.chart .ch{display:flex;align-items:center;gap:8px;padding:0 2px 2px}
.chart .dotc{width:8px;height:8px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 10px 1px var(--ac);flex:0 0 auto}
.chart .ch b{flex:1;font-size:13.5px;font-weight:800;color:#fff;letter-spacing:-.01em}
.chart .delta{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;border-radius:20px;
  background:rgba(255,255,255,.07);color:var(--dim)}
.chart .delta.up{color:#7ee0a6;background:rgba(126,224,166,.14)}
.chart .delta.dn{color:#ff8f6b;background:rgba(255,143,107,.14)}
.chart .cnow{display:flex;align-items:baseline;gap:9px;padding:6px 2px 8px}
.chart .cv{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;color:#fff;
  text-shadow:0 2px 16px rgba(0,0,0,.5)}
.chart .cs{font-size:10px;color:rgba(255,255,255,.55);line-height:1.4}
.spk{width:100%;height:100px;display:block}
.cx{display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,.4);
  padding:4px 2px 4px;font-family:var(--mono)}
.imp{border:2.5px dashed var(--line-2);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--panel)}
.imp .ih{display:flex;align-items:center;gap:9px;cursor:pointer}
.imp .ih b{flex:1;font-size:13.5px;font-weight:700}
.imp .ih span{font-size:17px;color:var(--dimmer);transition:transform .18s}
.imp.open .ih span{transform:rotate(90deg);color:var(--brass)}
.imp .ib{display:none;margin-top:12px}
.imp.open .ib{display:block}
.imp textarea{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;
  color:var(--chalk);font:400 13px/1.5 var(--mono);padding:11px;resize:none;min-height:92px}
.imp textarea:focus{outline:none;border-color:var(--brass)}
.imp .btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.imp .fbtn{flex:1;min-width:96px;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:10px;
  color:var(--chalk);font:600 12.5px var(--sans);padding:12px 6px;cursor:pointer;text-align:center}
.imp .fbtn:active{background:var(--line)}
.imp .run{width:100%;margin-top:9px;background:linear-gradient(180deg,var(--brass-2),var(--brass));border:0;
  border-radius:10px;color:#17191c;font:700 13.5px var(--sans);padding:13px 0;cursor:pointer}
.imp .fmt{font-size:10.5px;color:var(--dimmer);line-height:1.6;margin-top:9px}
.imp .fmt code{font-family:var(--mono);color:var(--dim)}
.imp .stat{font-size:11.5px;margin-top:9px;line-height:1.5}
.wide.w4{background:rgba(224,87,107,.20);border-color:#E0576B;
  box-shadow:0 10px 0 -1px #8E2F3E,0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(0,0,0,.8),inset 0 1.5px 0 rgba(255,255,255,.22),
    inset 0 0 46px -18px rgba(224,87,107,.9)}
.wide.w4:active{box-shadow:0 0 0 -1px #8E2F3E,0 2px 5px -4px rgba(0,0,0,.9),
    inset 0 3px 10px -4px rgba(0,0,0,.55),inset 0 0 46px -14px rgba(224,87,107,1)}
.wide.w4 svg{stroke:#F2889A}
.slot{display:flex;gap:6px;margin-top:2px}
.slot button{flex:1;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:8px;
  color:var(--dim);font:700 12px var(--sans);padding:10px 0;cursor:pointer}
.slot button.on{background:#E0576B;border-color:#E0576B;color:#fff}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.mc{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center}
.mc .v{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}

      if(n.includes(w)) s+=2;
      else if(w.endsWith("s")&&n.includes(w.slice(0,-1))) s+=2;
      else if(n.split(/[^a-z]+/).some(p=>p.startsWith(w.slice(0,4)))) s+=1;
    });
    const head=n.split(",")[0].trim().split(/\s+/);
    words.forEach(w=>{ if(head[0]===w||head[0]===w.replace(/s$/,"")) s+=3;
                       else if(head.includes(w)) s+=1; });
    if(n.split(",")[0].trim()===words.join(" ")) s+=3;
    if(s>score){score=s;best=f;}
  });
  return score>=2?{food:best,score:score}:null;
}
function parseFood(raw,db){
  if(/\b(no|nothing|didn'?t|did not|skipped|none)\b/.test(raw.toLowerCase())&&!/\d/.test(raw)) return [];
  const parts=raw.toLowerCase()
    .replace(/\b(i|had|ate|eat|for|breakfast|lunch|dinner|snack|today|just|then|also)\b/g," ")
    .split(/\s*(?:,|\band\b|\bplus\b|\bwith\b|\bon\b|\bover\b|\balong\b|\+|;|&)\s*/)
    .map(s=>s.trim()).filter(Boolean);
  const out=[];
  parts.forEach(p=>{
    const m=bestFood(p,db); if(!m) { out.push({raw:p,food:null,qty:1}); return; }
    let q=numFrom(p); if(q==null) q=1;
    out.push({raw:p,food:m.food,qty:q});
  });
  return out;
}

function parseBP(raw){
  const t=" "+raw.toLowerCase().replace(/,/g," ")+" ";
  let m=t.match(/(\d{2,3})\s*(?:\/|over|on)\s*(\d{2,3})/);
  if(!m) return null;
  const sys=+m[1], dia=+m[2];
  if(sys<70||sys>250||dia<40||dia>150||dia>=sys) return null;
  let pulse=null;
  const p=t.match(/(?:pulse|heart\s*rate|hr|bpm)\s*(?:of|was|is|at)?\s*(\d{2,3})/)
       || t.match(/(\d{2,3})\s*(?:bpm|pulse)/);
  if(p){const v=+p[1]; if(v>=30&&v<=220) pulse=v;}
  let slot=null;
  if(/\b(morning|a\.?m\.?|woke|wake)\b/.test(t)) slot="am";
  else if(/\b(evening|night|p\.?m\.?|bed)\b/.test(t)) slot="pm";
  return {sys:sys,dia:dia,pulse:pulse,slot:slot};
}
function parseWeight(raw){
  const t=" "+raw.toLowerCase().replace(/,/g," ")+" ";
  let w=null,unit=null,bf=null;
  let m=t.match(/(\d{2,3}(?:\.\d+)?)\s*(lbs?|pounds?|kgs?|kilos?|kilograms?)/);
  if(m){ w=parseFloat(m[1]); unit=/k/.test(m[2])?"kg":"lb"; }
  else { const n=t.match(/(?:weigh(?:ed|t)?|was|am|at)\s*(\d{2,3}(?:\.\d+)?)/);
         if(n){ w=parseFloat(n[1]); unit=w<100?"kg":"lb"; }
         else { const b=t.match(/\b(\d{2,3}(?:\.\d+)?)\b/); if(b){ w=parseFloat(b[1]); unit=w<100?"kg":"lb"; } } }
  const f=t.match(/(\d{1,2}(?:\.\d+)?)\s*%?\s*(?:body\s*fat|bf|fat)/) || t.match(/(?:body\s*fat|bf)\s*(?:of|at|is)?\s*(\d{1,2}(?:\.\d+)?)/);
  if(f) bf=parseFloat(f[1]);
  if(w==null) return null;
  if(unit==="kg") w=w*2.20462;
  if(w<80||w>400) return null;
  return {lb:Math.round(w*10)/10, bf:bf};
}

function parseStrength(raw,plan){
  const t=raw.trim(); if(!t) return null;
  const all=[]; Object.keys(plan||{}).forEach(d=>plan[d].ex.forEach(e=>all.push({n:e.n,day:d})));
  const low=t.toLowerCase();
  let hit=null,score=0;
  all.forEach(e=>{const n=e.n.toLowerCase();
    let s=0; n.split(/\s+/).forEach(w=>{if(w.length>2&&low.includes(w))s+=2;});
    if(low.includes(n))s+=4;
    if(s>score){score=s;hit=e;}});
  if(!hit||score<2) return null;
  const sets=[];
  const pairs=t.match(/(\d+(?:\.\d+)?)\s*(?:x|×|\*|for|@)\s*(\d+)/gi)||[];
  pairs.forEach(p=>{const m=p.match(/(\d+(?:\.\d+)?)\s*(?:x|×|\*|for|@)\s*(\d+)/i);
    if(m) sets.push({w:parseFloat(m[1]),r:parseInt(m[2])});});
  if(!sets.length){
    const w=t.match(/(\d{2,3}(?:\.\d+)?)\s*(?:lbs?|pounds?)?/);
    const r=t.match(/(\d{1,2})\s*(?:reps?)/i);
    if(w&&r) sets.push({w:parseFloat(w[1]),r:parseInt(r[1])});
  }
  if(!sets.length) return null;
  return {n:hit.n,day:hit.day,sets:sets};
}

function saveSess(){const sets=[];let rejected=0;
  const D=draftFor(day);
  Object.keys(D).forEach(n=>D[n].forEach((s,i)=>{
    const W=+s.w, R=+s.r;
    if(W>0&&W<=2000&&R>0&&R<=100) sets.push({n:n,set:i+1,w:W,r:R,rir:s.rir??null});
    else if(s.w!=null||s.r!=null) rejected++;}));
  if(!sets.length){toast(rejected?"Check those numbers":"Nothing to save");return;}
  if(rejected){toast(rejected+" set"+(rejected>1?"s":"")+" skipped — out of range");}
  /* v17-6: saves for the same day and day-type merge into one session instead of
     stacking a new one each time, and the form is left filled. Re-saving is
     idempotent: for a given exercise and set number the newest entry wins. */
  const today=dkey();
  const hit=DB.sessions.find(x=>String(x.date).slice(0,10)===today && x.day===day);
  let msg;
  if(hit){
    const byKey=new Map((hit.sets||[]).map(x=>[x.n+"#"+x.set,x]));
    let added=0,upd=0;
    sets.forEach(x=>{const k=x.n+"#"+x.set;
      if(byKey.has(k)){const o=byKey.get(k);
        if(o.w!==x.w||o.r!==x.r||o.rir!==x.rir){o.w=x.w;o.r=x.r;o.rir=x.rir;upd++;}}
      else{byKey.set(k,x);added++;}});
    hit.sets=[...byKey.values()].sort((a,b)=>a.n===b.n?a.set-b.set:(a.n<b.n?-1:1));
    hit._t=Date.now();
    msg=added||upd?("Session updated · "+hit.sets.length+" sets"+(upd?" · "+upd+" changed":"")):"Already saved";
  }else{
    DB.sessions.push({date:new Date().toISOString(),day:day,sets:sets});
    msg="Saved "+sets.length+" sets";
  }
  save();render();toast(msg);}

/* One-time repair for sessions split across several saves before v17-6.
   Runs once, snapshots first, and only touches days that actually have
   more than one session of the same day-type. */
function mergeSplitSessions(){
  const groups={};
  (DB.sessions||[]).forEach(x=>{
    const k=String(x.date).slice(0,10)+"|"+x.day;
    (groups[k]=groups[k]||[]).push(x);});
  const dupes=Object.keys(groups).filter(k=>groups[k].length>1);
  if(!dupes.length) return {days:0,removed:0,sets:0};
  snapshot("before merging split sessions");
  let removed=0,total=0;
  dupes.forEach(k=>{
    const g=groups[k].slice().sort((a,b)=>(a._t||0)-(b._t||0)||(a.date<b.date?-1:1));
    const keep=g[0], byKey=new Map();
    g.forEach(sn=>(sn.sets||[]).forEach(x=>byKey.set(x.n+"#"+x.set,x)));  /* newest wins */
    keep.sets=[...byKey.values()].sort((a,b)=>a.n===b.n?a.set-b.set:(a.n<b.n?-1:1));
    keep._t=Date.now();
    total+=keep.sets.length;
    g.slice(1).forEach(sn=>{ tomb(sn._id);
      DB.sessions.splice(DB.sessions.indexOf(sn),1); removed++; });
  });
  return {days:dupes.length,removed:removed,sets:total};
}

          n:w.length, days:new Set(w.map(x=>x.date)).size};}

/* ---------- RUNS & BOULDERING (kmlog-v17-4) ---------- */
const nnum=v=>typeof v==="number"&&isFinite(v);  /* isFinite(null) is true — Number(null) is 0 */
const HRMAX=186, EASY_CAP=140, BAND_LO=163, BAND_HI=178;
const STAGES=[
 {s:0,n:"Stage 0",d:"No running. Eccentrics only."},
 {s:1,n:"Stage 1",d:"1-min efforts at 60% effort. Max HR capped at 150. Duration before speed."},
 {s:2,n:"Stage 2",d:"Pickups and strides. Rep length building. Two clean weeks opens Stage 3."},
 {s:3,n:"Stage 3",d:"Tempo. 20–25 min at 80–83% of max HR."},
 {s:4,n:"Stage 4",d:"Helgerud 4×4 resumes. The Phase 1 six-cycle clock starts here."}];
const GRADES=["V0","V1","V2","V3","V4","V5","V6","V7","V8+"];

const s2hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(x).padStart(2,"0");};
const hms2s=t=>{if(t==null)return null;const p=String(t).trim().split(":").map(Number);
  if(p.some(isNaN)||!p.length)return null;
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];};
const paceOf=r=>(r.km&&r.secs)?r.secs/r.km:null;
const dOf=r=>String(r.date||"").slice(0,10);
const nice=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});

function curStage(){ const v=DB.runStage; return isFinite(v)?Math.max(0,Math.min(4,v)):2; }

function runFlags(r){
  const f=[];
  /* The <140 easy ceiling is a return-to-run policy, not a description of the
     back catalogue. Of 628 runs in the 2023–2026 Garmin export, 405 breach it —
     flagging those buries the ones that matter. Flags apply from the restart on. */
  if(dOf(r) < (DB.runPolicyFrom||"2026-05-15")) return f;
  if(r.type==="easy"&&nnum(r.avgHR)&&r.avgHR>EASY_CAP) f.push({t:"warn",m:"Avg HR "+r.avgHR+" over the "+EASY_CAP+" easy ceiling"});
  if(nnum(r.maxHR)&&r.maxHR>=BAND_LO&&r.maxHR<=BAND_HI) f.push({t:"warn",m:"Max HR "+r.maxHR+" inside the "+BAND_LO+"–"+BAND_HI+" injury band"});
  if(curStage()===1&&nnum(r.maxHR)&&r.maxHR>150) f.push({t:"warn",m:"Max HR "+r.maxHR+" over the Stage 1 cap of 150"});
  return f;
}

/* Garmin Connect activities export. Columns are matched by header name, so a
   reordered or trimmed export still reads. Non-running rows are ignored. */
function csvSplit(line){
  const out=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===","&&!q){out.push(cur);cur="";}
    else cur+=c;}
  out.push(cur);return out.map(s=>s.trim().replace(/^"|"$/g,""));
}
function parseGarmin(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {rows:[],skipped:0};
  const head=csvSplit(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
  const col=n=>head.indexOf(n);
  const iType=col("activitytype"),iDate=col("date"),iTitle=col("title"),iDist=col("distance"),
        iTime=col("time"),iAvg=col("avghr"),iMax=col("maxhr"),iTE=col("aerobicte"),iCal=col("calories");
  if(iDate<0||iDist<0||iTime<0) return {rows:[],skipped:lines.length,bad:true};
  const rows=[];let skipped=0;
  lines.slice(1).forEach(l=>{
    const c=csvSplit(l);
    const ty=(iType>=0?c[iType]:"Running")||"";
    if(!/run/i.test(ty)){skipped++;return;}
    const raw=c[iDate]||""; const date=raw.slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){skipped++;return;}
    const km=parseFloat(String(c[iDist]).replace(/[^0-9.]/g,""));
    const secs=hms2s(c[iTime]);
    if(!isFinite(km)||km<=0||!secs){skipped++;return;}
    const num=i=>{if(i<0)return null;const v=parseFloat(String(c[i]).replace(/[^0-9.]/g,""));return isFinite(v)?v:null;};
    rows.push({date:date, t:raw.length>10?raw:null, title:(iTitle>=0?c[iTitle]:"")||"Run",
      km:+km.toFixed(2), secs:secs, avgHR:num(iAvg), maxHR:num(iMax),
      te:num(iTE), kcal:num(iCal), type:"easy", reps:null, note:null, src:"garmin"});
  });
  return {rows:rows,skipped:skipped};
}

/* Interval sessions carry per-rep detail the activities export does not have.
   One JSON object per line, generated from a Garmin screen capture. */
function parseIntervalBlob(text){
  const rows=[];let skipped=0;
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    let o=null; try{o=JSON.parse(l);}catch(e){skipped++;return;}
    if(!o||!/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||"").slice(0,10))){skipped++;return;}
    const reps=Array.isArray(o.reps)?o.reps.map(r=>Array.isArray(r)?{sec:+r[0],hr:+r[1]||null}
      :{sec:+(r.sec||r.s),hr:+(r.hr)||null}).filter(r=>isFinite(r.sec)&&r.sec>0):null;
    rows.push({date:String(o.date).slice(0,10), title:o.title||"Intervals",
      km:nnum(o.km)?+o.km:null, secs:nnum(o.secs)?+o.secs:(o.time?hms2s(o.time):null),
      avgHR:nnum(o.avgHR)?+o.avgHR:null, maxHR:nnum(o.maxHR)?+o.maxHR:
        (reps&&reps.some(r=>r.hr)?Math.max(...reps.filter(r=>r.hr).map(r=>r.hr)):null),
      te:nnum(o.te)?+o.te:null, kcal:null, type:o.type||"interval",
      reps:reps, note:o.note||null, src:"manual"});
  });
  return {rows:rows,skipped:skipped};
}

function addRuns(rows){
  DB.runs=DB.runs||[];
  let added=0,dupe=0;
  rows.forEach(r=>{
    const hit=DB.runs.find(x=>x.date===r.date&&Math.abs((x.km||0)-(r.km||0))<0.02&&Math.abs((x.secs||0)-(r.secs||0))<30);
    if(hit){ // an interval blob upgrades the easy row the CSV already filed
      if(r.reps&&!hit.reps){hit.reps=r.reps;hit.type=r.type;hit.note=r.note||hit.note;added++;}
      else dupe++; return; }
    DB.runs.push(r); added++;
  });
  DB.runs.sort((a,b)=>a.date<b.date?-1:1);
  return {added:added,dupe:dupe};
}

function repSummary(reps){
  if(!reps||!reps.length) return "";
  const g=[];reps.forEach(r=>{const l=g[g.length-1];
    if(l&&l.sec===r.sec)l.n++;else g.push({sec:r.sec,n:1});});
  return g.map(x=>x.n+"×"+(x.sec%60?(x.sec/60).toFixed(1):x.sec/60)+" min").join(" + ");
}


/* ---------- RUN CALENDAR ---------- */
/* Manual marks live in DB.runCal. A day with no mark falls back to whatever the
   Garmin import filed for it, so the month fills in on its own; tapping a day
   overrides that, and tapping past the end clears back to the derived value. */
let calM=null;
const CAL_ORDER=["easy","int","tempo"];
const CAL_META={easy:{n:"Easy",c:"#6f96b8"},int:{n:"Intervals",c:"#63a882"},tempo:{n:"Tempo",c:"#c9973f"}};
function derivedMark(d){
  const r=(DB.runs||[]).filter(x=>x.date===d);
  if(!r.length) return null;
  if(r.some(x=>x.reps&&x.reps.length)) return "int";
  if(r.some(x=>x.type==="tempo")) return "tempo";
  if(r.some(x=>x.type==="interval")) return "int";
  return "easy";
}
const markOf=d=>DB.runCal&&DB.runCal[d]?DB.runCal[d]:derivedMark(d);
function cycleDay(d){
  DB.runCal=DB.runCal||{};
  const cur=DB.runCal[d]||null;
  const i=cur?CAL_ORDER.indexOf(cur):-1;
  if(i<0) DB.runCal[d]=CAL_ORDER[0];
  else if(i<CAL_ORDER.length-1) DB.runCal[d]=CAL_ORDER[i+1];
  else delete DB.runCal[d];
  save(); render();
}
function lastMark(kind){
  const days=new Set(Object.keys(DB.runCal||{}).filter(d=>DB.runCal[d]===kind));
  (DB.runs||[]).forEach(r=>{ if(!(DB.runCal||{})[r.date] && derivedMark(r.date)===kind) days.add(r.date); });
  const l=[...days].sort();
  if(!l.length) return null;
  const d=l[l.length-1];
  return {date:d, ago:Math.round((new Date(dkey()+"T12:00")-new Date(d+"T12:00"))/864e5)};
}
function calHTML(){
  const now=new Date();
  if(!calM) calM={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=calM;
  const first=new Date(y,m,1), lead=first.getDay(), len=new Date(y,m+1,0).getDate();
  const pad=n=>String(n).padStart(2,"0");
  const key=dd=>y+"-"+pad(m+1)+"-"+pad(dd);
  const today=dkey();
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cd off"></div>`;
  for(let d=1;d<=len;d++){
    const k=key(d), mk=markOf(k), meta=mk?CAL_META[mk]:null;
    const manual=!!(DB.runCal&&DB.runCal[k]);
    cells+=`<button class="cd${meta?" on":""}${k===today?" td":""}" data-d="${k}"
      ${meta?`style="--m:${meta.c}"`:""}>${d}${meta&&!manual?`<i class="au"></i>`:""}</button>`;
  }
  const li=lastMark("int");
  const label=new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const legend=CAL_ORDER.map(k=>`<span class="lg"><i style="background:${CAL_META[k].c}"></i>${CAL_META[k].n}</span>`).join("");
  return `<div class="cal">
    <div class="calh"><button class="cnav" id="cprev">‹</button><b>${label}</b><button class="cnav" id="cnext">›</button></div>
    <div class="cdow">${["S","M","T","W","T","F","S"].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cgrid">${cells}</div>
    <div class="calf">${legend}<span class="lg" style="color:var(--dimmer)">tap a day to cycle · tap past the end to clear</span></div>
    <div class="calsince">${li?`Last intervals <b>${li.ago===0?"today":li.ago===1?"yesterday":li.ago+" days ago"}</b> · ${nice(li.date)}`
      :"No interval session marked yet"}</div>
  </div>`;
}
function wireCal(){
  const p=document.getElementById("cprev"), n=document.getElementById("cnext");

}

/* ---------- CHARTS ---------- */
function spark(pts,o){
  o=o||{};
  const CAP=o.cap||120;
  let ma=null;
  if(o.avg&&pts.length>2){
    const k=o.avgN||7;
    ma=pts.map((_,i)=>{const s=pts.slice(Math.max(0,i-k+1),i+1);
      return s.reduce((a,b)=>a+b.v,0)/s.length;});
  }
  if(pts.length>CAP){ const step=pts.length/CAP; const t=[],tm=[];
    for(let i=0;i<CAP;i++){const j=Math.floor(i*step); t.push(pts[j]); if(ma) tm.push(ma[j]);}
    t[CAP-1]=pts[pts.length-1]; if(ma) tm[CAP-1]=ma[ma.length-1];
    pts=t; if(ma) ma=tm; } const W=o.w||330,H=o.h||100,P=8,B=16;
  if(!pts.length) return "";
  const ys=pts.map(p=>p.v).concat(ma||[]);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(o.target!=null){lo=Math.min(lo,o.target);hi=Math.max(hi,o.target);}
  if(hi===lo){hi=lo+1;lo=lo-1;}
  const pad=(hi-lo)*0.18; lo-=pad; hi+=pad;
  const X=i=>P+(i/Math.max(1,pts.length-1))*(W-P*2);
  const Y=v=>H-B-((v-lo)/(hi-lo))*(H-B-P);
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=d+` L ${X(pts.length-1).toFixed(1)} ${H-B} L ${X(0).toFixed(1)} ${H-B} Z`;
  const c=o.color||"#63a882", c2=o.color2||c, id=o.id||0;
  const grid=[0.25,0.5,0.75].map(f=>`<line x1="${P}" y1="${(P+(H-B-P)*f).toFixed(1)}" x2="${W-P}" y2="${(P+(H-B-P)*f).toFixed(1)}"
    stroke="rgba(255,255,255,.045)" stroke-width="1"/>`).join("");
  let avg="";
  if(ma){
    avg=`<path d="${ma.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ")}"
      fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;}
  let tgt="";
  if(o.target!=null) tgt=`<line x1="${P}" y1="${Y(o.target).toFixed(1)}" x2="${W-P}" y2="${Y(o.target).toFixed(1)}"
      stroke="#fff" stroke-opacity=".35" stroke-width="1.4" stroke-dasharray="3 5"/>
    <text x="${W-P}" y="${(Y(o.target)-5).toFixed(1)}" text-anchor="end" font-size="8.5"
      fill="rgba(255,255,255,.5)" font-family="ui-monospace,monospace">${o.targetLabel||o.target}</text>`;
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"
      fill="${c}" fill-opacity=".55"/>`).join("");
  const last=pts[pts.length-1], lx=X(pts.length-1), ly=Y(last.v);
  const dp=o.dp!=null?o.dp:1;
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="ga${id}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="${c}" stop-opacity=".45"/>
        <stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>
      <linearGradient id="gs${id}" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c}"/></linearGradient>
      <filter id="gl${id}" x="-30%" y="-60%" width="160%" height="260%">
        <feGaussianBlur stdDeviation="3.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#ga${id})"/>${tgt}
    <path d="${d}" fill="none" stroke="url(#gs${id})" stroke-width="3" stroke-linejoin="round"
      stroke-linecap="round" filter="url(#gl${id})"/>
    ${avg}${dots}
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="8" fill="${c}" fill-opacity=".22"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.4" fill="${c}" filter="url(#gl${id})"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="1.8" fill="#fff"/>
  </svg>`;}

function chartCard(title,sub,pts,o){
  o=o||{};
  const total=pts.length;
  if(pts.length<2) return `<div class="chart"><div class="ch"><b>${title}</b><i>needs at least two entries</i></div></div>`;
  const first=pts[0].v,last=pts[pts.length-1].v,d=last-first;
  const dp=o.dp!=null?o.dp:1;
  if(total>120) sub=sub+" · showing a sample";
  const good=o.invert? d<0 : d>0;
  const col=o.color||"#63a882";
  return `<div class="chart" style="--ac:${col}">
    <div class="ch"><span class="dotc"></span><b>${title}</b>
      <span class="delta ${d===0?"":good?"up":"dn"}">${d>0?"▲ +":d<0?"▼ ":"— "}${d===0?"":Math.abs(d).toFixed(dp)}</span></div>
    <div class="cnow"><span class="cv">${last.toFixed(dp)}</span><span class="cs">${sub}</span></div>
    ${spark(pts,o)}
    <div class="cx"><span>${pts[0].l}</span><span>${pts[pts.length-1].l}</span></div></div>`;}

      <div class="fmt">CSV columns: <code>${F}</code> — a header row is optional. The app's own
      export re-imports cleanly. <b>On iPhone:</b> from Mail, tap the attachment, then the share icon, then <b>Copy</b> — or save it to Files first. Copy-and-paste is the more reliable route.<br><br><b>Screenshots:</b> your phone can already copy text out of an image
      (long-press the image → Google Lens → Select all → Copy), which is far more accurate than

function wireImp(kind){
  const box=document.getElementById("imp"); if(!box) return;
  document.getElementById("imph").onclick=()=>box.classList.toggle("open");

  document.getElementById("impimg").onclick=()=>document.getElementById("impi").click();
  document.getElementById("impf").onchange=e=>{const f=e.target.files[0];

        " lines<br><span style=\"font-family:var(--mono);font-size:10px;color:var(--dimmer)\">"+
        esc(first)+"…</span><br>Now tap <b>Read and preview</b>.";};

    stat.style.color="var(--brass)";
    stat.innerHTML="In-app OCR is not built in — it is large, slow on a phone, and less accurate than what your phone already does.<br><br><b>Do this instead:</b> open the screenshot in Google Photos, tap Lens, tap Select all, Copy, then paste into the box above.";};
  document.getElementById("imprun").onclick=()=>runImport(kind,ta.value,stat,FMT[kind]||"");
}

function splitRows(txt){
  return txt.trim().split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
}
function runImport(kind,txt,stat,F){
  if(!txt||!txt.trim()){stat.style.color="var(--hot)";stat.textContent="Nothing to read.";return;}
  txt=String(txt).replace(/^\uFEFF/,"")
     .replace(/\u00a0/g," ")
     .replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
     .replace(/[\u2010-\u2015]/g,"-")
     .replace(/\u200b/g,"");
  const lines=splitRows(txt);
  const DELIM = /\t/.test(txt) ? "\t" : (/;/.test(txt)&&!/,/.test(txt) ? ";" : ",");
  const isCSV = lines.filter(l=>l.includes(DELIM)).length >= Math.max(1,lines.length*0.6);
  const today = dkey();
  const normDate = s => {
    s=(s||"").trim();
    let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if(m) return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){ const a=+m[1],bb=+m[2];
      const mo = a>12 ? bb : a, dd = a>12 ? a : bb;   // ambiguous: assume M/D/Y
      return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(dd).padStart(2,"0"); }
    return null;};
  let added=0, skipped=0, out=[];
  const push=(rec)=>{out.push(rec);};

  lines.forEach(line=>{
    if(/^\uFEFF?(date|day)\b/i.test(line)) return;
    if(isCSV && line.includes(DELIM)){
      const c=line.split(DELIM).map(x=>x.trim().replace(/^"|"$/g,""));
      const d=normDate(c[0]);
      if(d && d>today){ skipped++; return; }
      if(kind==="sleep"&&d&&c[1]&&c[2]){ const hh=+c[3]||hrs(c[1],c[2]);
        if(hh>0&&hh<=16) push({date:d,bed:c[1],wake:c[2],hrs:hh,q:c[4]?+c[4]:null}); else skipped++; return; }
      if(kind==="bp"&&d&&c[2]){ const S=+c[2],D=+c[3];
        if(S>=70&&S<=250&&D>=40&&D<=150&&D<S) push({date:d,slot:(c[1]||"am").toLowerCase().startsWith("p")?"pm":"am",
          sys:S,dia:D,pulse:c[4]?+c[4]:null});
        else skipped++; return; }
      if(kind==="weight"&&d&&c[1]){ const lb=+c[1]; if(lb>=80&&lb<=400) push({date:d,lb:lb,bf:c[2]?+c[2]:null}); else skipped++; return; }
      if(kind==="strength"&&d&&c[2]){ const W=+c[4],R=+c[5];
        if(W>0&&W<=2000&&R>0&&R<=100) push({date:d,day:c[1]||"W1",n:c[2],set:+c[3]||1,w:W,r:R,rir:c[6]===""?null:+c[6]});
        else skipped++; return; }
      if(kind==="food"&&d&&c[1]){ push({date:d,n:c[1],q:+c[2]||1,unit:c[3]||"serving",
        kcal:+c[4]||0,p:+c[5]||0,c:+c[6]||0,f:+c[7]||0,s:+c[8]||0}); return; }
      skipped++; return;
    }
    // free text, one entry per line
    if(kind==="sleep"){ const r=parseSleep(line);
      if(r.bed&&r.wake){push({date:dkey(),bed:r.bed,wake:r.wake,hrs:hrs(r.bed,r.wake),q:r.q}); return;} skipped++; return; }
    if(kind==="bp"){ const r=parseBP(line);
      if(r){push({date:dkey(),slot:r.slot||"am",sys:r.sys,dia:r.dia,pulse:r.pulse}); return;} skipped++; return; }
    if(kind==="weight"){ const r=parseWeight(line);
      if(r){push({date:dkey(),lb:r.lb,bf:r.bf}); return;} skipped++; return; }
    if(kind==="strength"){ const r=parseStrength(line,DB.plan);
      if(r&&r.sets.length){ r.sets.forEach((s,i)=>push({date:dkey(),day:r.day,n:r.n,set:i+1,w:s.w,r:s.r,rir:s.rir??null})); return; }
      skipped++; return; }
    if(kind==="food"){ parseFood(line,(DB.customFoods||[]).concat(FOODDB)).forEach(x=>{
        if(!x.food){skipped++;return;} const g=x.food.sg*x.qty;
        push({date:dkey(),n:x.food.n,q:x.qty,unit:x.food.sl,kcal:x.food.kcal*g/100,p:x.food.p*g/100,
              c:x.food.c*g/100,f:x.food.f*g/100,s:x.food.s*g/100});}); return; }
    skipped++;
  });

  if(!out.length){stat.style.color="var(--hot)";
    const first=(lines[0]||"").slice(0,52);
    stat.innerHTML="Nothing recognised in "+lines.length+" line"+(lines.length===1?"":"s")+
      ".<br><span style=\"font-family:var(--mono);font-size:10px;color:var(--dimmer)\">first line: "+
      esc(first)+"</span><br>Expected columns: <b>"+esc(F)+"</b>";return;}
  stat.style.color="var(--go)";
  stat.innerHTML=`Found <b>${out.length}</b> entr${out.length>1?"ies":"y"}${skipped?` · ${skipped} line${skipped>1?"s":""} skipped`:""}.
    <button class="run" id="impgo" style="margin-top:9px">Add ${out.length} to history</button>`;
  document.getElementById("impgo").onclick=()=>{
    if(kind==="sleep"){DB.sleep=DB.sleep||[];
      out.forEach(r=>{const i=DB.sleep.findIndex(x=>x.date===r.date); if(i>=0)DB.sleep[i]=r;else DB.sleep.push(r);});
      DB.sleep.sort((a,b)=>a.date<b.date?-1:1);}
    if(kind==="weight"){DB.weight=DB.weight||[];
      out.forEach(r=>{const i=DB.weight.findIndex(x=>x.date===r.date); if(i>=0)DB.weight[i]=r;else DB.weight.push(r);});
      DB.weight.sort((a,b)=>a.date<b.date?-1:1);}
    if(kind==="food"){DB.food=(DB.food||[]).concat(out);}
    if(kind==="bp"){DB.bp=(DB.bp||[]).concat(out);DB.bp.sort((a,b)=>a.date<b.date?-1:1);}
    if(kind==="strength"){DB.sessions=DB.sessions||[];
      const byDate={}; out.forEach(r=>{const k=r.date+"|"+r.day; (byDate[k]=byDate[k]||[]).push(r);});
      Object.entries(byDate).forEach(([k,rows])=>{const [d,day]=k.split("|");
        DB.sessions.push({date:new Date(d+"T12:00").toISOString(),day:day,
          sets:rows.map(x=>({n:x.n,set:x.set,w:x.w,r:x.r,rir:x.rir}))});});
      DB.sessions.sort((a,b)=>a.date<b.date?-1:1);}
    save(); render(); toast(out.length+" imported");};
}

function foodTotals(d){const r=(DB.food||[]).filter(x=>x.date===(d||dkey()));
  return {kcal:r.reduce((a,b)=>a+b.kcal,0),p:r.reduce((a,b)=>a+b.p,0),
          c:r.reduce((a,b)=>a+b.c,0),f:r.reduce((a,b)=>a+b.f,0),s:r.reduce((a,b)=>a+b.s,0),rows:r};}
function foodV(){
  const T=foodTotals(), pc=(v,t)=>Math.min(100,Math.round(v/t*100));
  const rows=T.rows.slice().reverse().map((x,i)=>`<div class="fr">
     <span class="fn"><b>${esc(x.n)}</b><i>${x.q} × ${x.unit.replace(/^1\s+/,"")} · ${Math.round(x.p)}p ${Math.round(x.c)}c ${Math.round(x.f)}f · ${Math.round(x.s)}g sugar</i></span>
     <span class="fk">${Math.round(x.kcal)}</span>
     <button class="add" data-del="${T.rows.length-1-i}" style="border-color:var(--hot);color:var(--hot)">×</button></div>`).join("")
   ||`<div class="empty">Nothing logged today.<br>Search below to add.</div>`;

   <div class="mac">
     <div class="mc"><div class="v">${Math.round(T.kcal)}</div><div class="k">kcal</div><div class="t">of ${TGT.kcal}</div>
       <div class="pbar"><i style="width:${pc(T.kcal,TGT.kcal)}%"></i></div></div>
     <div class="mc"><div class="v">${Math.round(T.p)}</div><div class="k">protein</div><div class="t">of ${TGT.p}g</div>
       <div class="pbar p"><i style="width:${pc(T.p,TGT.p)}%"></i></div></div>
     <div class="mc"><div class="v">${Math.round(T.c)}</div><div class="k">carbs</div><div class="t">of ${TGT.c}g</div>
       <div class="pbar c"><i style="width:${pc(T.c,TGT.c)}%"></i></div></div>
     <div class="mc"><div class="v">${Math.round(T.f)}</div><div class="k">fat</div><div class="t">of ${TGT.f}g</div>
       <div class="pbar f"><i style="width:${pc(T.f,TGT.f)}%"></i></div></div>
   </div>
   <div class="dl" style="border-bottom:0;padding:2px 4px 12px"><span class="a">Sugar today</span>
     <span class="b">${Math.round(T.s)} g</span></div>
   ${(()=>{const by={};(DB.food||[]).forEach(f=>{by[f.date]=by[f.date]||{k:0,p:0};by[f.date].k+=f.kcal;by[f.date].p+=f.p;});
      const ds=Object.keys(by).sort(); if(ds.length<2) return "";
      const lab=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
      return chartCard("Calories per day",ds.length+" days · dotted line is "+TGT.kcal,
        ds.map(d=>({v:Math.round(by[d].k),l:lab(d)})),{color:"#34d399",color2:"#a3e635",target:TGT.kcal,targetLabel:"target",id:4,dp:0})
       + chartCard("Protein per day","dotted line is "+TGT.p+"g",
        ds.map(d=>({v:Math.round(by[d].p),l:lab(d)})),{color:"#fbbf24",color2:"#fb923c",target:TGT.p,targetLabel:"target",id:5,dp:0});})()}
   ${impPanel("food")}
   <div class="say">
     <textarea id="fsay" placeholder="Say or type what you ate — &quot;2 eggs, bacon and white toast&quot;"></textarea>
     <div class="hintl">Tap the mic on your phone keyboard to dictate. Nothing saves until you confirm.</div>
     <div class="row"><button class="clr" id="fsayc">Clear</button><button class="go2" id="fsayg">Read it</button></div>
     <div id="fconf"></div>
   </div>
   <input class="srch" id="fq" placeholder="Or search — chicken, oats, banana…" autocomplete="off">
   <div id="fres"></div>
      <h2 class="sec">Today</h2><div id="flist">${rows}</div>
   <div class="note">Targets are the eVolt Aug 15 muscle-gain recommendation: ${TGT.kcal} kcal · ${TGT.p}g protein · ${TGT.c}g carbs · ${TGT.f}g fat. Values are database estimates, not measurements — treat them as directional.</div></div>`;}

function wireFood(){
  const q=document.getElementById("fq"), res=document.getElementById("fres");
  const custom=DB.customFoods||[];
  const draw=()=>{
    const t=q.value.trim().toLowerCase();
    if(!t){res.innerHTML="";return;}
    const all=custom.concat(FOODDB);
    const hits=all.filter(f=>f.n.toLowerCase().includes(t)).slice(0,12);
    res.innerHTML = hits.map((f,i)=>`<div class="fr" data-i="${i}">
        <span class="fn"><b>${esc(f.n)}</b><i>${esc(f.sl)} · ${Math.round(f.kcal*f.sg/100)} kcal · ${Math.round(f.p*f.sg/100)}g protein</i></span>
        <button class="add" data-pick="${i}">+</button></div>`).join("")
      || `<div class="fr"><span class="fn"><b>No match</b><i>Add "${esc(q.value.trim())}" with your own numbers</i></span>
           <button class="add" data-new="1">+</button></div>`;
    res.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pick(hits[+b.dataset.pick]));
    const nb=res.querySelector("[data-new]"); if(nb) nb.onclick=()=>addCustom(q.value.trim());
  };
  q.oninput=draw;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const T=foodTotals(); const row=T.rows[+b.dataset.del];
    if(row) tomb(row._id);
    DB.food=DB.food.filter(x=>x!==row); save(); render(); toast("Removed");});
}
function wireFoodSay(){
  const ta=document.getElementById("fsay"), out=document.getElementById("fconf");
  if(!ta) return;
  let parsed=[];
  document.getElementById("fsayc").onclick=()=>{ta.value="";out.innerHTML="";parsed=[];};
  document.getElementById("fsayg").onclick=()=>{
    const txt=ta.value.trim(); if(!txt){toast("Nothing to read");return;}
    parsed=parseFood(txt,(DB.customFoods||[]).concat(FOODDB));
    const good=parsed.filter(x=>x.food), bad=parsed.filter(x=>!x.food);
    if(!good.length){ out.innerHTML=`<div class="conf"><h4>Could not match</h4>
      <div class="miss">Nothing recognised. Try simpler wording, or use the search box below.</div></div>`; return; }
    out.innerHTML=`<div class="conf"><h4>Check before saving</h4>`+
      good.map((x,i)=>`<div class="ci" data-i="${i}">
        <input class="q" inputmode="decimal" value="${x.qty}">
        <span class="nm">${esc(x.food.n)}<u>${x.food.sl.replace(/^1\s+/,"")} · ${Math.round(x.food.kcal*x.food.sg/100)} kcal each</u></span>
        <button class="drop" data-drop="${i}">×</button></div>`).join("")+
      (bad.length?`<div class="miss">Not recognised: ${bad.map(b=>esc(b.raw)).join(", ")}</div>`:"")+
      `<div class="row"><button class="go2" id="fcommit">Add ${good.length} item${good.length>1?"s":""}</button></div></div>`;
    const live=good.slice();
    out.querySelectorAll(".q").forEach((inp,i)=>inp.oninput=()=>{live[i].qty=parseFloat(inp.value)||0;});
    out.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{live[+b.dataset.drop].qty=0;
      b.closest(".ci").style.opacity=".35";});
    document.getElementById("fcommit").onclick=()=>{
      let n=0; DB.food=DB.food||[];
      live.forEach(x=>{ if(!x.qty||x.qty<=0) return; const g=x.food.sg*x.qty;
        DB.food.push({date:dkey(),n:x.food.n,q:x.qty,unit:x.food.sl,
          kcal:x.food.kcal*g/100,p:x.food.p*g/100,c:x.food.c*g/100,f:x.food.f*g/100,s:x.food.s*g/100}); n++; });
      if(!n){toast("Nothing selected");return;}
      save(); render(); toast(n+" item"+(n>1?"s":"")+" logged");};
  };
}
function pick(f){
  const n=prompt(`How many ${f.sl.replace(/^1\s+/,"")}?  (1 = ${f.sg} g)`,"1");
  if(n===null) return; const q=parseFloat(n); if(!q||q<=0) return;
  const g=f.sg*q;
  DB.food=DB.food||[];
  DB.food.push({date:dkey(),n:f.n,q:q,unit:f.sl,
    kcal:f.kcal*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100,s:f.s*g/100});
  save(); render(); toast(f.n+" added");
}
function addCustom(name){
  const kcal=parseFloat(prompt("Calories per serving?","")); if(!kcal) return;
  const p=parseFloat(prompt("Protein grams?","0"))||0;
  const c=parseFloat(prompt("Carb grams?","0"))||0;
  const f=parseFloat(prompt("Fat grams?","0"))||0;
  const s=parseFloat(prompt("Sugar grams?","0"))||0;
  const rec={n:name,kcal:kcal,p:p,c:c,f:f,s:s,sg:100,sl:"1 serving"};
  DB.customFoods=DB.customFoods||[]; if(!DB.customFoods.some(x=>x.n.toLowerCase()===name.toLowerCase())) DB.customFoods.push(rec);
  DB.food=DB.food||[];
  DB.food.push({date:dkey(),n:name,q:1,unit:"serving",kcal:kcal,p:p,c:c,f:f,s:s});
  save(); render(); toast(name+" saved to your foods");
}

function sleepV(){const S=DB.sleep,t=dkey(),ex=S.find(x=>x.date===t);
  const w7=windowAvg(S,7,"hrs"), w14=windowAvg(S,14,"hrs");
  const a7=w7&&w7.v, a14=w14&&w14.v;
  let st=0,d=new Date();
  if(!S.find(x=>x.date===dkey(d))) d.setDate(d.getDate()-1);   // today still open
  while(S.find(x=>x.date===dkey(d))){st++;d.setDate(d.getDate()-1);}
  const loggedToday=!!S.find(x=>x.date===dkey());
  const cards=S.length?`<div class="scards">
    <div class="sc"><div class="v">${a7?a7.toFixed(1):"—"}<u>h</u></div><div class="k">last 7 days${w7?` · ${w7.n} logged`:""}</div></div>
    <div class="sc"><div class="v">${a14?a14.toFixed(1):"—"}<u>h</u></div><div class="k">last 14 days${w14?` · ${w14.n} logged`:""}</div></div>
    <div class="sc"><div class="v">${st}</div><div class="k">night streak${st&&!loggedToday?" · to yesterday":""}</div></div></div>`:"";
  const list=S.slice(-14).reverse().map(x=>`<div class="dl"><span class="a">${new Date(x.date+"T12:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}<u>${x.bed} – ${x.wake}</u></span>
    <span class="b ${x.hrs<6.5?'bad':x.hrs>=7.5?'ok':''}">${x.hrs.toFixed(1)}h${x.q?`<u>quality ${x.q}/5</u>`:""}</span></div>`).join("")
    ||`<div class="empty">No nights logged yet.<br>Two numbers a night is all this takes.</div>`;
  return `<div class="wrap">${cards}
   ${S.length>1?chartCard("Sleep trend",S.length+" nights · dotted line is 7 hours",S.map(x=>({v:x.hrs,l:new Date(x.date+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})})),{color:"#38bdf8",color2:"#5eead4",avg:true,target:7,targetLabel:"7h",id:3}):""}
   ${impPanel("sleep")}
   <div class="say">
     <textarea id="ssay" placeholder="Say or type — &quot;slept 6.5 hours, quite well&quot; or &quot;bed 11:30, woke 6:15, rough&quot;"></textarea>
     <div class="hintl">Tap the mic on your phone keyboard to dictate. Nothing saves until you confirm.</div>
     <div class="row"><button class="clr" id="ssayc">Clear</button><button class="go2 n" id="ssayg">Read it</button></div>
     <div id="sconf"></div>
   </div>
   <div class="card open"><div class="chead" style="cursor:default"><div class="cn"><b>${ex?"Update last night":"Last night"}</b>
     <i>${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</i></div></div>
     <div class="cbody" style="display:block">
       <div class="srow" style="border-bottom:0">
         <div class="fg"><span class="fl">Lights out</span><input class="n" type="time" id="sb" value="${ex?ex.bed:"23:00"}"></div>
         <div class="fg"><span class="fl">Woke</span><input class="n" type="time" id="sw" value="${ex?ex.wake:"07:00"}"></div></div>
       <div class="srow" style="border-bottom:0;padding-top:0">
         <div class="fg"><span class="fl">Quality — optional</span>
           <div class="pk" id="sq">${[1,2,3,4,5].map(q=>`<button class="pb" data-q="${q}">${q}</button>`).join("")}</div>
           <span class="gh">1 poor · 5 excellent</span></div></div>
       <div class="cue" id="sd">—</div></div></div>
      <h2 class="sec">Last 14 nights</h2>${list}
   <div class="note">The 14-night average is what makes the next blood panel interpretable. If IGF-1 returns low on documented short nights, that is an explanation rather than another open question.</div></div>`;}
function wireSleep(){const b=document.getElementById("sb"),w=document.getElementById("sw"),o=document.getElementById("sd");
  const ex=DB.sleep.find(x=>x.date===dkey());let q=ex?ex.q:null;
  const up=()=>{const h=hrs(b.value,w.value);o.className="cue"+(h>=7?" go":"");
    o.textContent=h?`${h.toFixed(1)} hours${h<6.5?" — short. This is the variable most likely holding back the training.":h>=7.5?" — good.":""}`:"Set both times";};
  b.oninput=up;w.oninput=up;up();
  document.querySelectorAll("#sq .pb").forEach(btn=>{if(q&&+btn.dataset.q===q)btn.classList.add("on");
    btn.onclick=()=>{q=+btn.dataset.q;document.querySelectorAll("#sq .pb").forEach(x=>x.classList.remove("on"));btn.classList.add("on");};});
  document.getElementById("sq").dataset.q=q||"";
  document.querySelectorAll("#sq .pb").forEach(btn=>{const o=btn.onclick;btn.onclick=()=>{o();document.getElementById("sq").dataset.q=btn.dataset.q;};});}
function wireSleepSay(){
  const ta=document.getElementById("ssay"), out=document.getElementById("sconf");
  if(!ta) return;
  document.getElementById("ssayc").onclick=()=>{ta.value="";out.innerHTML="";};
  document.getElementById("ssayg").onclick=()=>{
    const txt=ta.value.trim(); if(!txt){toast("Nothing to read");return;}
    const r=parseSleep(txt);
    let bed=r.bed, wake=r.wake;
    if(!bed&&!wake&&r.hrs){ wake=document.getElementById("sw").value||"07:00";
      const [wh,wm]=wake.split(":").map(Number);
      let m=wh*60+wm-Math.round(r.hrs*60); if(m<0)m+=1440;
      bed=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
    if(bed&&!wake&&r.hrs){ const [bh,bm]=bed.split(":").map(Number);
      let m=(bh*60+bm+Math.round(r.hrs*60))%1440;
      wake=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
    if(!bed||!wake){ out.innerHTML=`<div class="conf n"><h4>Could not read that</h4>
      <div class="miss" style="color:var(--cyan)">Try "slept 6.5 hours" or "bed 11:30, woke 6:15". You can also set the times below by hand.</div></div>`; return; }
    const hh=hrs(bed,wake);
    const QW={1:"terrible",2:"poor",3:"ok",4:"good",5:"excellent"};
    out.innerHTML=`<div class="conf n"><h4>Check before saving</h4>
      <div class="ci"><span class="nm">Lights out<u>from what you said</u></span><b style="font-family:var(--mono)">${bed}</b></div>
      <div class="ci"><span class="nm">Woke<u>${r.hrs&&!r.bed?"back-calculated from hours":"from what you said"}</u></span><b style="font-family:var(--mono)">${wake}</b></div>
      <div class="ci"><span class="nm">Duration</span><b style="font-family:var(--mono);color:${hh<6.5?"var(--hot)":hh>=7.5?"var(--go)":"var(--chalk)"}">${hh.toFixed(1)} h</b></div>
      ${r.q?`<div class="ci"><span class="nm">Quality</span><b style="font-family:var(--mono)">${r.q}/5 · ${QW[r.q]}</b></div>`:""}
      <div class="row"><button class="go2 n" id="scommit">Save this night</button></div></div>`;
    document.getElementById("scommit").onclick=()=>{
      const t=dkey(), rec={date:t,bed:bed,wake:wake,hrs:hh,q:r.q??null};
      const i=DB.sleep.findIndex(x=>x.date===t); if(i>=0)DB.sleep[i]=rec; else DB.sleep.push(rec);
      DB.sleep.sort((a,b2)=>a.date<b2.date?-1:1); save(); render(); toast(hh.toFixed(1)+"h logged");};
  };
}
function saveSleep(){const b=document.getElementById("sb").value,w=document.getElementById("sw").value;
  if(!b||!w){toast("Set both times");return;}
  if(hrs(b,w)<=0||hrs(b,w)>16){toast("Check those times");return;}
  const t=dkey(),rec={date:t,bed:b,wake:w,hrs:hrs(b,w),q:(()=>{const e=document.getElementById("sq");return e&&e.dataset.q?+e.dataset.q:null;})()};
  const i=DB.sleep.findIndex(x=>x.date===t);if(i>=0)DB.sleep[i]=rec;else DB.sleep.push(rec);
  DB.sleep.sort((a,b2)=>a.date<b2.date?-1:1);save();render();toast(rec.hrs.toFixed(1)+"h logged");}

function metricsV(){return `<div class="wrap">
  <div class="tiles">
    ${(()=>{const W=DB.weight||[],l=W[W.length-1];
      return l?`<div class="tile"><div class="k">Body weight</div><div class="v">${l.lb.toFixed(1)}<u>lbs</u></div><div class="s">logged ${new Date(l.date+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div></div>`
              :`<div class="tile"><div class="k">Skeletal muscle</div><div class="v">79.6<u>lbs</u></div><div class="s">Aug 16 2026 · Pergola</div></div>`;})()}
    <div class="tile b"><div class="k">VO2 max</div><div class="v">48<u>ml/kg</u></div><div class="s">~3,571 ml/min absolute anchor</div></div>
    <div class="tile"><div class="k">Body fat</div><div class="v">13.8<u>%</u></div><div class="s">22.7 lbs fat mass</div></div>
    ${(()=>{const w=windowAvg(DB.sleep,14,"hrs");const a=w&&w.v;
      const cls=a==null?"r":a<6.5?"r":a>=7.5?"g":"";
      return `<div class="tile ${cls}"><div class="k">Sleep</div><div class="v">${a?a.toFixed(1):"~5.5"}<u>h</u></div>
        <div class="s">${a?"last 14 days · "+w.n+" night"+(w.n>1?"s":"")+" logged":"self-reported · start logging"}</div></div>`;})()}
  </div>`+METRICS.map(g=>`<h2 class="sec">${g.g}</h2>`+g.r.map(r=>
    `<div class="dl"><span class="a">${r[0]}${r[2]?`<u>${r[2]}</u>`:""}</span><span class="b ${r[3]||""}">${r[1]}</span></div>`).join("")).join("")
  +`<div class="note">Mirrors dashboard v14 · August 15 2026. Figures are the current anchors, not live readings — the dashboard remains the source of truth.</div></div>`;}

function timeV(){return `<div class="wrap"><h2 class="sec">Dashboard evolution</h2><div class="tl">`+
  VERSIONS.slice().reverse().map(v=>`<div class="ev ${v.now?'now':''}"><div class="vn">${v.v}</div><div class="vd">${v.d}</div><div class="vt">${v.t}</div></div>`).join("")+
  `</div><div class="note">Versions before v9c are partially reconstructed from the project archive; early numbering was less consistent than the record above implies.</div></div>`;}

function backupsHTML(){
  const list=snapshots();
  if(!list.length) return `<div class="note" style="padding:8px 4px 0">A snapshot is taken automatically before any bulk load. None yet.</div>`;
  return list.slice().reverse().map((s,i)=>{
    const idx=list.length-1-i;
    let n=0; try{const d=JSON.parse(s.raw);
      n=(d.sessions||[]).length+(d.sleep||[]).length+(d.food||[]).length+(d.weight||[]).length+(d.bp||[]).length;}catch(e){}
    return `<div class="dl"><span class="a">${new Date(s.at).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
      ${new Date(s.at).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
      <u>${esc(s.reason)} · ${n} entries</u></span>
      <button class="pb" data-restore="${idx}" style="flex:0 0 auto;padding:8px 12px;font-size:12px">Restore</button></div>`;
  }).join("")+`<div class="note" style="padding:8px 4px 0">The last five are kept. Restoring replaces what is logged now — the current state is snapshotted first.</div>`;}

function progV(){if(!DB.sessions.length)return `<div class="wrap">${impPanel("strength")}<div class="empty">No sessions logged yet.<br>Log one, or import your history above.</div><h2 class="sec">Backups</h2>${backupsHTML()}</div>`;
  const names=[...new Set(DB.sessions.flatMap(s=>s.sets.map(x=>x.n)))];
  return `<div class="wrap">${impPanel("strength")}<h2 class="sec">Best estimated 1RM</h2>`+
   names.map((n,i)=>{
     const pts=DB.sessions.filter(s=>s.sets.some(x=>x.n===n)).map(s=>({
       v:Math.max(...s.sets.filter(x=>x.n===n).map(x=>e1rm(x.w,x.r))),
       l:new Date(s.date).toLocaleDateString(undefined,{day:"numeric",month:"short"})}));
     const d=pts.length>1?pts[pts.length-1].v-pts[0].v:null;
     return `<div class="exw"><div class="dl exh" data-ex="${i}" style="cursor:pointer">
       <span class="a">${esc(n)}<u>${pts.length} session${pts.length>1?"s":""} · tap for trend</u></span>
       <span class="b"><b>${bestFor(n).toFixed(0)}</b>${d!==null?`<u style="color:${d>0?"var(--go)":d<0?"var(--hot)":"var(--dimmer)"}">${d>0?"+":""}${d.toFixed(0)}</u>`:""}</span></div>
       <div class="exc" id="exc${i}" style="display:none">${pts.length>1
         ? chartCard(esc(n)+" — estimated 1RM",pts.length+" sessions",pts,{color:"#f0a938",color2:"#fde047",id:100+i,dp:0})
         : `<div class="note" style="padding:8px 4px">Log this again and the trend appears here.</div>`}</div></div>`;}).join("")+
   `<h2 class="sec">Backups</h2>`+backupsHTML()+`<h2 class="sec">Recent sessions</h2>`+DB.sessions.slice(-8).reverse().map(s=>{const by={};
     s.sets.forEach(x=>{(by[x.n]=by[x.n]||[]).push(x.w+"×"+x.r);});
     const idx=DB.sessions.indexOf(s);
     return `<div class="dl" style="display:block"><div style="display:flex;align-items:baseline;gap:10px">
       <span class="a" style="flex:1;color:var(--brass);font-family:var(--mono);font-size:11px">${new Date(s.date).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})} · ${esc(s.day)}</span>
       <button class="drop" data-sess="${idx}" style="color:var(--hot);background:none;border:0;font-size:16px;padding:2px 6px;cursor:pointer">×</button></div>
       <div style="font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7">${Object.entries(by).map(([k,v])=>esc(k)+" "+v.join(", ")).join("<br>")}</div></div>`;}).join("")+
   `<div style="padding:20px 4px"><button class="del" id="wipe">Erase all data</button></div></div>`;}

function csv(){const rows=[["date","day","exercise","set","weight","reps","rir","est1rm"]];
  DB.sessions.forEach(s=>s.sets.forEach(x=>rows.push([dkey(new Date(s.date)),s.day,x.n,x.set,x.w,x.r,x.rir??"",e1rm(x.w,x.r).toFixed(1)])));
  let out=rows.map(r=>r.join(",")).join("\n");
  if(DB.sleep.length)out+="\n\ndate,bedtime,wake,hours,quality\n"+DB.sleep.map(s=>[s.date,s.bed,s.wake,s.hrs.toFixed(2),s.q??""].join(",")).join("\n");
  if((DB.food||[]).length)out+="\n\ndate,food,qty,unit,kcal,protein,carbs,fat,sugar\n"+DB.food.map(f=>[f.date,'"'+f.n+'"',f.q,f.unit,f.kcal.toFixed(0),f.p.toFixed(1),f.c.toFixed(1),f.f.toFixed(1),f.s.toFixed(1)].join(",")).join("\n");
  if((DB.bp||[]).length)out+="\n\ndate,slot,systolic,diastolic,pulse\n"+DB.bp.map(b=>[b.date,b.slot,b.sys,b.dia,b.pulse??""].join(",")).join("\n");
  if((DB.weight||[]).length)out+="\n\ndate,weight_lb,bodyfat_pct\n"+DB.weight.map(w=>[w.date,w.lb,w.bf??""].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));
  a.download="physique_log_"+dkey()+".csv";a.click();toast("Exported");}
document.addEventListener("click",e=>{if(e.target.id==="wipe"&&confirm("Erase every logged session and night?")){
  DB={plan:JSON.parse(JSON.stringify(SEED)),sessions:[],sleep:[],food:[],customFoods:[],weight:[],
      _del:[],_wipe:Date.now()+1};save();tab=day;render();toast("Erased");}});
document.getElementById("hm").onclick=()=>{tab="home";render();};
window.addEventListener("storage",e=>{ if(e.key===K){ DB=load(); render(); toast("Updated from another window"); }});
(()=>{ try{
    if(!localStorage.getItem("kmMerge_v1")){
      const r=mergeSplitSessions();
      localStorage.setItem("kmMerge_v1", new Date().toISOString());
      if(r.days){ save(); setTimeout(()=>toast("Merged "+r.removed+" split session"+(r.removed>1?"s":"")+" across "+r.days+" day"+(r.days>1?"s":"")), 800); }
    }}catch(e){} })();
render();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          const bar=document.createElement("div");
          bar.style.cssText="position:fixed;left:12px;right:12px;bottom:96px;z-index:70;background:var(--amber);"+
            "color:#20170a;font:700 13.5px var(--sans);padding:14px 16px;border-radius:12px;display:flex;"+
            "align-items:center;gap:12px;box-shadow:0 8px 24px -8px rgba(0,0,0,.7)";
          bar.innerHTML='<span style="flex:1">A newer version is ready.</span>'+
            '<button style="background:#20170a;color:#f0a938;border:0;border-radius:8px;font:700 12.5px var(--sans);padding:9px 14px">Update</button>';
          bar.querySelector("button").onclick=()=>{ nw.postMessage({type:"SKIP_WAITING"}); };
          document.body.appendChild(bar);
        }});});
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloaded) return; reloaded=true; location.reload();});
}
</script>
